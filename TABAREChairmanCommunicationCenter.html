<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TABARE · Broadcast Center</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #e8ecf1; color: #0b1c2e; line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 1.5rem 1rem; }
    .container { width: 100%; max-width: 1000px; background: #ffffff; border-radius: 16px; box-shadow: 0 8px 40px rgba(0, 0, 0, 0.12); padding: 2rem; margin-bottom: 1.5rem; }
    .header { display: flex; align-items: center; gap: 1rem; border-bottom: 3px solid #d97706; padding-bottom: 1rem; margin-bottom: 1.5rem; }
    .header .logo-container { flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: #fef3e8; border-radius: 12px; padding: 6px; width: 60px; height: 60px; }
    .header .logo-container img { height: 55px; max-width: 55px; object-fit: contain; border-radius: 8px; }
    .header .title-group h1 { font-size: 18pt; font-weight: 800; color: #0b1c2e; line-height: 1.1; }
    .header .title-group h1 span { color: #d97706; }
    .header .title-group .subtitle { font-size: 9.5pt; color: #52647a; font-weight: 500; }

    .stats-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-bottom: 1.5rem; }
    .stat-card { background: #f8fafc; border-radius: 10px; padding: 0.8rem; text-align: center; border: 1px solid #e2e8f0; }
    .stat-card .stat-number { font-size: 20pt; font-weight: 800; color: #0b1c2e; display: block; }
    .stat-card .stat-label { font-size: 8pt; color: #94a3b8; font-weight: 500; text-transform: uppercase; }
    .stat-card .stat-icon { color: #d97706; font-size: 1.2rem; margin-bottom: 0.2rem; }

    .chairman-config { display: flex; flex-wrap: wrap; align-items: center; gap: 0.8rem; background: #f1f5f9; padding: 0.6rem 1rem; border-radius: 8px; margin-bottom: 0.8rem; border: 1px solid #e2e8f0; }
    .chairman-config label { font-weight: 600; font-size: 9pt; color: #0b1c2e; display: flex; align-items: center; gap: 0.4rem; }
    .chairman-config input { padding: 0.3rem 0.6rem; border: 1px solid #dde5ed; border-radius: 6px; font-size: 9.5pt; width: 180px; }

    .message-section { background: #f8fafc; border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; border: 2px solid #e2e8f0; }
    .message-section h3 { font-size: 11pt; font-weight: 700; color: #0b1c2e; margin-bottom: 0.8rem; }
    .message-section h3 i { color: #d97706; margin-right: 0.5rem; }

    .template-buttons { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.8rem; }
    .btn-template { padding: 0.4rem 1rem; background: #f1f5f9; border: 1px solid #dde5ed; border-radius: 20px; font-size: 8.5pt; font-weight: 500; color: #52647a; cursor: pointer; }
    .btn-template:hover { background: #e2e8f0; }

    .message-input-group textarea { width: 100%; padding: 0.8rem; border: 2px solid #dde5ed; border-radius: 8px; font-size: 10.5pt; font-family: 'Inter', sans-serif; resize: vertical; min-height: 120px; }

    .member-selection { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 0.8rem; margin: 0.8rem 0; }
    .selection-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; flex-wrap: wrap; gap: 0.5rem; }
    .selection-controls button { padding: 0.3rem 0.8rem; border: 1px solid #dde5ed; border-radius: 6px; background: #f8fafc; font-size: 8.5pt; font-weight: 600; cursor: pointer; color: #52647a; }
    .selected-count { font-size: 9pt; font-weight: 600; color: #0b1c2e; }
    .member-list-container { max-height: 250px; overflow-y: auto; border: 1px solid #f1f5f9; border-radius: 6px; }
    .member-list-container table { width: 100%; border-collapse: collapse; font-size: 9.5pt; }
    .member-list-container th { background: #f8fafc; padding: 0.5rem; text-align: left; position: sticky; top: 0; font-size: 8.5pt; color: #52647a; }
    .member-list-container td { padding: 0.4rem 0.6rem; border-bottom: 1px solid #f1f5f9; }

    .action-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.6rem; padding: 0.9rem 1.5rem; border-radius: 10px; font-weight: 600; font-size: 10.5pt; border: none; cursor: pointer; transition: all 0.25s ease; width: 100%; color: #fff; }
    .btn-whatsapp { background: #25D366; }
    .btn-sms { background: #0b1c2e; }
    .btn:hover { opacity: 0.9; transform: translateY(-2px); }

    .toast { position: fixed; bottom: 2rem; right: 2rem; padding: 1rem 1.5rem; border-radius: 12px; color: #fff; font-weight: 600; z-index: 2000; display: none; }
    .toast.show { display: block; }
    .toast.success { background: #0f7b3a; }

    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; padding: 2rem; align-items: center; justify-content: center; }
    .modal.visible { display: flex; }
    .modal-content { background: #fff; border-radius: 16px; padding: 2rem; max-width: 500px; width: 100%; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="logo-container"><img src="finallogo.jpg" onerror="this.style.display='none'"></div>
      <div class="title-group">
        <h1>TABARE <span>MARABA</span></h1>
        <div class="subtitle">Chairman's Broadcast Center</div>
      </div>
    </div>

    <div class="stats-bar">
      <div class="stat-card"><span class="stat-number" id="totalMembers">0</span><span class="stat-label">Total Members</span></div>
      <div class="stat-card"><span class="stat-number" id="activeMembers">0</span><span class="stat-label">Active Members</span></div>
      <div class="stat-card"><span class="stat-number" id="selectedCountDisplay">0</span><span class="stat-label">Selected</span></div>
    </div>

    <div class="message-section">
      <h3><i class="fas fa-pen"></i> Compose Message</h3>
      
      <div class="chairman-config">
        <label><i class="fab fa-whatsapp" style="color:#25D366;"></i> Your WhatsApp:</label>
        <input type="text" id="chairmanWhatsApp" placeholder="e.g. 2348012345678" value="2347084473184" />
      </div>

      <div class="template-buttons">
        <button class="btn-template" onclick="insertTemplate('meeting')"><i class="fas fa-calendar"></i> Meeting Notice</button>
        <button class="btn-template" onclick="insertTemplate('dues')"><i class="fas fa-money-bill"></i> Dues Reminder</button>
        <button class="btn-template" onclick="clearMessage()"><i class="fas fa-eraser"></i> Clear</button>
      </div>

      <div class="message-input-group">
        <textarea id="messageInput" placeholder="Type your message here..." maxlength="1600"></textarea>
      </div>

      <div class="member-selection">
        <div class="selection-header">
          <div class="selected-count">Selected: <span id="selectedCount">0</span></div>
          <div class="selection-controls">
            <button onclick="selectAllMembers()">Select All</button>
            <button onclick="clearSelection()">Clear</button>
          </div>
        </div>

        <div class="member-list-container" id="memberListContainer">
          <table>
            <thead><tr><th style="width:30px;"></th><th>Name</th><th>Phone</th></tr></thead>
            <tbody id="memberTableBody"></tbody>
          </table>
        </div>
      </div>

      <div class="action-buttons">
        <button class="btn btn-whatsapp" onclick="sendBroadcast('WhatsApp')"><i class="fab fa-whatsapp"></i> WhatsApp</button>
        <button class="btn btn-sms" onclick="sendBroadcast('SMS')"><i class="fas fa-sms"></i> SMS</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <div class="modal" id="confirmModal">
    <div class="modal-content">
      <h3>Confirm Broadcast</h3>
      <p style="margin:0.5rem 0;">Sending to <strong id="modalCount">0</strong> members via <strong id="modalChannel">WhatsApp</strong>.</p>
      <div style="display:flex; gap:1rem; margin-top:1rem;">
        <button onclick="document.getElementById('confirmModal').classList.remove('visible')" style="flex:1; padding:0.5rem; background:#e2e8f0; border:none; border-radius:8px; cursor:pointer;">Cancel</button>
        <button onclick="executeBroadcast()" style="flex:1; padding:0.5rem; background:#0f7b3a; color:#fff; border:none; border-radius:8px; cursor:pointer;">Send Now</button>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = { apiKey: "AIzaSyBGerm6n6NeHyWVu7V-oP7nFLSH7vg8Avg", authDomain: "tabare-maraba.firebaseapp.com", projectId: "tabare-maraba", storageBucket: "tabare-maraba.firebasestorage.app", messagingSenderId: "204144494424", appId: "1:204144494424:web:82e1006399c1b94eb9c72d" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let allMembers = [];
    let selectedMembers = [];
    let broadcastChannel = '';
    let broadcastMessage = '';

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.className = 'toast show success';
      setTimeout(() => t.className = 'toast', 3000);
    }

    db.collection('MembershipList').orderBy('fullName').onSnapshot(snap => {
      allMembers = [];
      snap.forEach(doc => {
        const d = doc.data();
        if (d.phone) allMembers.push({ id: doc.id, name: d.fullName, phone: d.phone, status: d.status });
      });
      
      document.getElementById('totalMembers').textContent = allMembers.length;
      document.getElementById('activeMembers').textContent = allMembers.filter(m => m.status === 'active' || m.status === 'approved').length;
      
      renderMembers();
    });

    function renderMembers() {
      const tbody = document.getElementById('memberTableBody');
      tbody.innerHTML = allMembers.map(m => {
        const checked = selectedMembers.some(s => s.id === m.id) ? 'checked' : '';
        return `
          <tr>
            <td><input type="checkbox" ${checked} onchange="toggleMember('${m.id}')"></td>
            <td>${m.name}</td>
            <td>${m.phone}</td>
          </tr>
        `;
      }).join('');
      document.getElementById('selectedCount').textContent = selectedMembers.length;
      document.getElementById('selectedCountDisplay').textContent = selectedMembers.length;
    }

    function toggleMember(id) {
      const m = allMembers.find(x => x.id === id);
      const idx = selectedMembers.findIndex(x => x.id === id);
      if (idx >= 0) selectedMembers.splice(idx, 1);
      else selectedMembers.push(m);
      renderMembers();
    }

    function selectAllMembers() { selectedMembers = [...allMembers]; renderMembers(); }
    function clearSelection() { selectedMembers = []; renderMembers(); }

    function insertTemplate(type) {
      const input = document.getElementById('messageInput');
      if (type === 'meeting') input.value = "📢 NOTICE OF GENERAL MEETING\n\nDate: [Date]\nTime: [Time]\nVenue: [Venue]\n\nYour attendance is mandatory.\nTABARE Cooperative";
      if (type === 'dues') input.value = "💰 DUES REMINDER\n\nPlease pay your monthly dues.\nAmount: ₦[Amount]\n\nThank you.\nTABARE Cooperative";
    }
    function clearMessage() { document.getElementById('messageInput').value = ''; }

    function sendBroadcast(channel) {
      broadcastChannel = channel;
      broadcastMessage = document.getElementById('messageInput').value.trim();

      if (!broadcastMessage) return alert('Please enter a message.');
      if (selectedMembers.length === 0) return alert('Please select at least one member.');

      document.getElementById('modalCount').textContent = selectedMembers.length;
      document.getElementById('modalChannel').textContent = channel;
      document.getElementById('confirmModal').classList.add('visible');
    }

    function executeBroadcast() {
      document.getElementById('confirmModal').classList.remove('visible');
      
      // WhatsApp/SMS limit: We can only open one chat at a time via browser for bulk.
      // So we open the first one, and log the rest.
      const first = selectedMembers[0];
      
      let phone = first.phone.replace(/[^0-9]/g, '');
      if (phone.length === 10) phone = '234' + phone;
      else if (phone.length === 11 && phone.startsWith('0')) phone = '234' + phone.substring(1);

      if (broadcastChannel === 'WhatsApp') {
        window.open(`https://wa.me/${phone}?text=${encodeURIComponent(broadcastMessage)}`, '_blank');
        showToast(`Opening WhatsApp for ${first.name}. Total recipients: ${selectedMembers.length}`);
      } else {
        window.location.href = `sms:${phone}?body=${encodeURIComponent(broadcastMessage)}`;
        showToast(`Opening SMS for ${first.name}. Total recipients: ${selectedMembers.length}`);
      }
    }
  </script>
</body>
</html>
